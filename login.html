<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>FireDeck</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@600;700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500&display=swap">
<style>
:root{
  --ground:#E4E7E9; --surface:#F5F7F8; --ink:#15191B; --muted:#5B666C;
  --line:#C5CDD1; --accent:#BE3018; --accent-ink:#FFFFFF;
  --epd-paper:#D9D7D0; --epd-ink:#16160F; --epd-line:#A9A79D;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --ground:#121618; --surface:#1B2125; --ink:#E7EDEF; --muted:#96A3AA;
  --line:#313B41; --accent:#E2573A; --accent-ink:#17110F;
}}
:root[data-theme="dark"]{
  --ground:#121618; --surface:#1B2125; --ink:#E7EDEF; --muted:#96A3AA;
  --line:#313B41; --accent:#E2573A; --accent-ink:#17110F;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;background:var(--ground);color:var(--ink);
  font-family:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  display:flex;align-items:center;justify-content:center;
  padding:calc(24px + env(safe-area-inset-top,0px)) 16px calc(24px + env(safe-area-inset-bottom,0px));
}
.kaart{width:100%;max-width:400px}

/* Een stukje e-ink als beeldmerk: het toestel waar dit over gaat. */
.paneel{
  background:var(--epd-paper);color:var(--epd-ink);
  border:1px solid var(--epd-line);border-radius:3px;
  font-family:"IBM Plex Mono",ui-monospace,monospace;
  padding:0;margin-bottom:22px;overflow:hidden;
}
.paneel .bar{
  display:flex;justify-content:space-between;font-size:9px;
  padding:3px 6px;border-bottom:1px solid var(--epd-line);
}
.paneel .mid{padding:16px 12px 14px;text-align:center}
.paneel .mid svg{width:34px;height:34px;margin-bottom:6px}
.paneel .mid b{display:block;font-size:13px;letter-spacing:.06em;text-transform:uppercase}
.paneel .mid span{display:block;font-size:9.5px;color:#6E6D63;margin-top:3px}
.paneel .foot{
  border-top:1px solid var(--epd-line);padding:3px 6px;font-size:9px;color:#6E6D63;
  display:flex;justify-content:space-between;
}

h1{
  font-family:"Barlow Semi Condensed",system-ui,sans-serif;font-weight:700;
  text-transform:uppercase;letter-spacing:.01em;font-size:27px;margin:0 0 4px;
}
p.lead{color:var(--muted);font-size:13.5px;margin:0 0 20px;line-height:1.5}

form{display:flex;flex-direction:column;gap:10px}
label{
  font-size:10px;letter-spacing:.09em;text-transform:uppercase;
  color:var(--muted);font-weight:500;
}
input[type=password]{
  font-family:"IBM Plex Mono",monospace;font-size:16px;
  padding:11px 12px;background:var(--surface);color:var(--ink);
  border:1px solid var(--line);border-radius:0;width:100%;
}
input[type=password]:focus{outline:2px solid var(--accent);outline-offset:-1px;border-color:var(--accent)}
button{
  font-family:"Barlow Semi Condensed",sans-serif;font-weight:700;
  text-transform:uppercase;letter-spacing:.06em;font-size:15px;
  background:var(--accent);color:var(--accent-ink);border:0;border-radius:0;
  padding:12px;cursor:pointer;
}
button:hover{filter:brightness(1.08)}
button:focus-visible{outline:2px solid var(--ink);outline-offset:2px}

.fout{
  border-left:3px solid var(--accent);padding:7px 0 7px 11px;
  font-size:13px;color:var(--ink);background:transparent;margin:0;
}
.voet{color:var(--muted);font-size:11.5px;margin:18px 0 0;line-height:1.5}
</style>
</head>
<body>
<div class="kaart">

  <div class="paneel" aria-hidden="true">
    <div class="bar"><span>BE-HSS-BW-04</span><span>&#9602;&#9604;&#9606; -71dBm &middot; 87%</span></div>
    <div class="mid">
      <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.2"
           stroke-linejoin="round" stroke-linecap="round">
        <path d="M1.6 14V7.6L6 4.4l4.4 3.2V14"/>
        <path d="M4.4 14v-3.4h3.2V14"/>
        <path d="M12.4 6.6c1.8 1.5 2.6 2.7 2.6 4a2.6 2.6 0 0 1-5.2 0c0-1.4 1-2.5 2.6-4z"/>
      </svg>
      <b>Vergrendeld</b>
      <span>wachtwoord vereist</span>
    </div>
    <div class="foot"><span>T-Deck Pro</span><span>240&times;320</span></div>
  </div>

  <h1>FireDeck</h1>
  <p class="lead">Een bedienbare T-Deck Pro met de berichtflow voor een brandweerploeg.
     Vraag het wachtwoord aan Bj&ouml;rn.</p>

  <!--FOUT-->

  <form method="POST" action="/login" autocomplete="on">
    <label for="ww">Wachtwoord</label>
    <input id="ww" name="ww" type="password" autocomplete="current-password"
           autocapitalize="none" autocorrect="off" spellcheck="false"
           autofocus required>
    <button type="submit">Openen</button>
  </form>

  <p class="voet">Deze pagina toont een gesimuleerd toestel. Wat je erop doet blijft in je
     eigen browser.</p>

</div>
</body>
</html>
